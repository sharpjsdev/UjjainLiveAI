<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8DC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE4B5;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="templeGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#bgGradient)"/>
  
  <!-- Decorative Top Pattern -->
  <circle cx="540" cy="200" r="150" fill="#FF9933" opacity="0.1"/>
  <circle cx="540" cy="200" r="120" fill="#FFD700" opacity="0.15"/>
  
  <!-- Main Temple/Mahakaleshwar Symbol -->
  <g transform="translate(540, 600)">
    <!-- Outer Circle -->
    <circle cx="0" cy="0" r="280" fill="none" stroke="#FF9933" stroke-width="8"/>
    <circle cx="0" cy="0" r="260" fill="none" stroke="#FFD700" stroke-width="2"/>
    
    <!-- Temple Spire (Shikara style) -->
    <path d="M 0,-200 L 80,-100 L 60,-20 L 40,80 L 20,160 L 0,200 L -20,160 L -40,80 L -60,-20 L -80,-100 Z" 
          fill="#FF9933" stroke="#8B4513" stroke-width="3"/>
    
    <!-- Golden highlights on spire -->
    <path d="M -20,-150 L 0,-120 L 20,-150" fill="#FFD700" opacity="0.8"/>
    <path d="M -30,-80 L 0,-50 L 30,-80" fill="#FFD700" opacity="0.7"/>
    <path d="M -40,0 L 0,30 L 40,0" fill="#FFD700" opacity="0.6"/>
    
    <!-- Om Symbol (ॐ) - Center -->
    <text x="0" y="30" font-size="140" font-family="serif" fill="#800080" 
          text-anchor="middle" font-weight="bold" opacity="0.9">ॐ</text>
    
    <!-- Decorative dots -->
    <circle cx="-150" cy="-120" r="12" fill="#DC143C"/>
    <circle cx="150" cy="-120" r="12" fill="#DC143C"/>
    <circle cx="-180" cy="0" r="10" fill="#FFD700"/>
    <circle cx="180" cy="0" r="10" fill="#FFD700"/>
    <circle cx="-150" cy="120" r="12" fill="#228B22"/>
    <circle cx="150" cy="120" r="12" fill="#228B22"/>
  </g>
  
  <!-- River Waves (Shipra River) -->
  <g transform="translate(0, 1000)" opacity="0.6">
    <path d="M 0,50 Q 135,30 270,50 T 540,50 T 810,50 T 1080,50" 
          stroke="#87CEEB" stroke-width="4" fill="none"/>
    <path d="M 0,70 Q 135,50 270,70 T 540,70 T 810,70 T 1080,70" 
          stroke="#87CEEB" stroke-width="3" fill="none"/>
    <path d="M 0,90 Q 135,70 270,90 T 540,90 T 810,90 T 1080,90" 
          stroke="#87CEEB" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Text: Simhastha -->
  <text x="540" y="1150" font-size="96" font-family="Arial, sans-serif" 
        fill="#FF9933" text-anchor="middle" font-weight="bold" letter-spacing="4">
    SIMHASTHA
  </text>
  
  <!-- Text: Ujjain -->
  <text x="540" y="1280" font-size="72" font-family="Arial, sans-serif" 
        fill="#8B4513" text-anchor="middle" font-weight="600" letter-spacing="2">
    UJJAIN 2028
  </text>
  
  <!-- Subtitle -->
  <text x="540" y="1380" font-size="48" font-family="Arial, sans-serif" 
        fill="#800080" text-anchor="middle" font-style="italic" opacity="0.8">
    Sacred Kumbh Mela
  </text>
  
  <!-- App Name -->
  <text x="540" y="1520" font-size="56" font-family="Arial, sans-serif" 
        fill="#FF9933" text-anchor="middle" font-weight="bold" letter-spacing="2">
    AI ASSISTANT
  </text>
  
  <!-- Tagline -->
  <text x="540" y="1620" font-size="40" font-family="Arial, sans-serif" 
        fill="#5D4037" text-anchor="middle" opacity="0.7">
    Your Digital Spiritual Guide
  </text>
  
  <!-- Decorative Elements at Bottom -->
  <g opacity="0.3">
    <path d="M 200,1700 Q 300,1680 400,1700 T 600,1700 T 800,1700" 
          stroke="#FF9933" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  </g>
  
  <!-- Loading indicator placeholder -->
  <g transform="translate(540, 1800)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#FF9933" stroke-width="4" opacity="0.3"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#FFD700" stroke-width="3" 
            stroke-dasharray="47,47" opacity="0.8" transform-origin="0 0">
      <animateTransform attributeName="transform" type="rotate" 
                        from="0" to="360" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Blessing rays (optional animation) -->
  <g opacity="0.1">
    <line x1="540" y1="200" x2="540" y2="400" stroke="#FFD700" stroke-width="2"/>
    <line x1="700" y1="300" x2="800" y2="400" stroke="#FFD700" stroke-width="2"/>
    <line x1="380" y1="300" x2="280" y2="400" stroke="#FFD700" stroke-width="2"/>
  </g>
</svg>